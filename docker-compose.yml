services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks: [lunartides]
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v3.0.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks: [lunartides]

  loki:
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/var/loki
    networks: [lunartides]

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    networks: [lunartides]

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor
      - GF_SECURITY_ADMIN_PASSWORD=lunartides
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      # Persist dashboards and alert rules built during the workshop across
      # container restarts.
      - grafana_data:/var/lib/grafana
    networks: [lunartides]
    depends_on:
      - prometheus
      - loki
      - tempo

  # vcs — student-owned REST source-control subject. Telemetry pre-wired to the
  # collector. Logic is correct but has no safeguards, so it crashes or degrades
  # under load — telemetry is the only way to observe it.
  vcs:
    build: ./vcs
    # Hard memory ceiling makes OOM timing deterministic across host machines —
    # Scenario 1 (object flood) reliably kills the container at this bound.
    mem_limit: 256m
    ports:
      - "8081:8081"
    environment:
      - VCS_ADDR=:8081
      - OTEL_SERVICE_NAME=vcs
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    networks: [lunartides]
    depends_on:
      - otel-collector

  # dgs — GraphQL oracle. NO telemetry by design. Ships as a prebuilt PUBLIC
  # image from GHCR; source stays out of this repo, so it runs as a true black
  # box. Pin to a released tag (e.g. :v1.0.0) for a stable workshop.
  dgs:
    image: ghcr.io/woodpeqr/dgs:latest
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      - DGS_ADDR=:8080
      - VCS_BASE_URL=http://vcs:8081
    networks: [lunartides]
    depends_on:
      - vcs

volumes:
  loki-data:
  tempo-data:
  grafana_data:

networks:
  lunartides:
    driver: bridge
