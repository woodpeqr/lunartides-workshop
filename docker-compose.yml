services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks: [lunartides]
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v3.0.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./telemetry/prometheus:/prometheus
    ports:
      - "9090:9090"
    networks: [lunartides]

  loki:
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - ./telemetry/loki:/var/loki
    networks: [lunartides]

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - ./telemetry/tempo:/var/tempo
    networks: [lunartides]

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor
      - GF_SECURITY_ADMIN_PASSWORD=lunartides
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      # Dashboards and alerts built during the workshop persist here on disk.
      # Grafana state is authored config, not ingested telemetry — kept separate.
      - ./grafana/data:/var/lib/grafana
    networks: [lunartides]
    depends_on:
      - prometheus
      - loki
      - tempo

  # entity-service — the student-owned REST service (CRUD over entities, e.g.
  # network devices). Telemetry is pre-wired to the collector.
  entity-service:
    build: ./entity-service
    mem_limit: 256m
    # Restart if the process exits so the service comes back on its own.
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      # Persist the store file on the host so it survives restarts/recreates.
      # Kept outside ./entity-service so it never bloats the docker build context.
      - ./entity-service-data:/data
    environment:
      - ENTITY_ADDR=:8081
      - ENTITY_STORE_PATH=/data/entities.json
      - OTEL_SERVICE_NAME=entity-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      # Export metrics every 5s (the SDK default is 60s) for quicker feedback.
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    networks: [lunartides]
    depends_on:
      - otel-collector

  # dgs-service — GraphQL service that exercises entity-service and drives the
  # workshop scenarios. Prebuilt image from GHCR; source is not in this repo.
  # Pin to a released tag (e.g. :v1.0.0) for a stable workshop.
  dgs-service:
    image: ghcr.io/woodpeqr/dgs-service:latest
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      - DGS_ADDR=:8080
      - ENTITY_BASE_URL=http://entity-service:8081
    networks: [lunartides]
    depends_on:
      - entity-service

networks:
  lunartides:
    driver: bridge
