services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks: [lunartides]
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v3.0.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./telemetry/prometheus:/prometheus
    ports:
      - "9090:9090"
    networks: [lunartides]

  loki:
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - ./telemetry/loki:/var/loki
    networks: [lunartides]

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - ./telemetry/tempo:/var/tempo
    networks: [lunartides]

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor
      - GF_SECURITY_ADMIN_PASSWORD=lunartides
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      # Dashboards and alerts built during the workshop persist here on disk.
      # Grafana state is authored config, not ingested telemetry — kept separate.
      - ./grafana/data:/var/lib/grafana
    networks: [lunartides]
    depends_on:
      - prometheus
      - loki
      - tempo

  # entity-service — student-owned REST service (CRUD over entities, e.g. network
  # devices). Functionally correct but has NO safeguards: a JSON file is its only
  # store, read/written whole on every request with no cache, no lock, no caps.
  # Under load it degrades, corrupts its store file, or OOMs — telemetry is the
  # only way to observe it. Telemetry pre-wired to the collector.
  entity-service:
    build: ./entity-service
    mem_limit: 256m
    # Recover after an OOM kill so the flood scenario is repeatable: the container
    # dies, restarts, and the ramp can be watched again (a sawtooth in Grafana).
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ENTITY_ADDR=:8081
      - ENTITY_STORE_PATH=/data/entities.json
      - OTEL_SERVICE_NAME=entity-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      # Export metrics every 5s (SDK default is 60s). Standard OTel env var, no
      # code change. The failure scenarios ramp over tens of seconds, so a 60s
      # window would let the container OOM before a single export — students
      # would see a flatline then a gap, never the ramp that predicts the crash.
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    networks: [lunartides]
    depends_on:
      - otel-collector

  # dgs-service — GraphQL oracle over entity-service. Blunt PASS/FAIL verdicts,
  # ZERO telemetry by design. Also hosts the failure scenarios (meta namespace).
  # Prebuilt PUBLIC image from GHCR; source stays out of this repo — a true black
  # box. Pin to a released tag (e.g. :v1.0.0) for a stable workshop.
  dgs-service:
    image: ghcr.io/woodpeqr/dgs-service:latest
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      - DGS_ADDR=:8080
      - ENTITY_BASE_URL=http://entity-service:8081
    networks: [lunartides]
    depends_on:
      - entity-service

networks:
  lunartides:
    driver: bridge
