services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks: [lunartides]
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v3.0.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./telemetry/prometheus:/prometheus
    ports:
      - "9090:9090"
    networks: [lunartides]

  loki:
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - ./telemetry/loki:/var/loki
    networks: [lunartides]

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - ./telemetry/tempo:/var/tempo
    networks: [lunartides]

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor
      - GF_SECURITY_ADMIN_PASSWORD=lunartides
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      # Dashboards and alerts built during the workshop persist here on disk.
      # Grafana state is authored config, not ingested telemetry — kept separate.
      - ./grafana/data:/var/lib/grafana
    networks: [lunartides]
    depends_on:
      - prometheus
      - loki
      - tempo

  vcs:
    build: ./vcs
    mem_limit: 256m
    ports:
      - "8081:8081"
    environment:
      - VCS_ADDR=:8081
      - OTEL_SERVICE_NAME=vcs
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      # Export metrics every 5s (SDK default is 60s). Standard OTel env var, no
      # code change. The failure scenarios ramp over tens of seconds, so a 60s
      # window would let the container OOM before a single export — students
      # would see a flatline then a gap, never the ramp that predicts the crash.
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    networks: [lunartides]
    depends_on:
      - otel-collector

  dgs:
    image: ghcr.io/woodpeqr/dgs:latest
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      - DGS_ADDR=:8080
      - VCS_BASE_URL=http://vcs:8081
    networks: [lunartides]
    depends_on:
      - vcs

networks:
  lunartides:
    driver: bridge
